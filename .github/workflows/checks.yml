# Checks for the voice server's home, Roy's fork. The workflow is named
# `checks`, like garage-door's and tv-mcp's, because the bridge's phone page
# reads the levels the quality job keeps with each push to voice. It runs only in
# roykollensvendsen/dreame-mcp, on the `voice` branch and on pull requests to
# it. Upstream's ci.yml stays as Sandra keeps it, for pull requests to her.
name: checks

on:
  push:
    branches: ["voice"]
  pull_request:
    branches: ["voice"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository == 'roykollensvendsen/dreame-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check src tests scripts/mutate.py scripts/ratchet.py
      - name: Format
        run: uv run ruff format --check src tests scripts/mutate.py scripts/ratchet.py
      - name: Types
        run: uv run pyright src scripts/mutate.py scripts/ratchet.py
        env:
          PYRIGHT_PYTHON_FORCE_VERSION: latest

  test:
    if: github.repository == 'roykollensvendsen/dreame-mcp'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml claims >=3.12.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --dev
      # No robot, cloud login or Tasshack clone here: those tests skip.
      - run: uv run pytest -q

  mutations:
    if: github.repository == 'roykollensvendsen/dreame-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --dev
      - name: Each rule's own test fails when the rule is switched off
        run: uv run python scripts/mutate.py

  # The quality levels (scripts/ratchet.py). A push to voice measures them and keeps
  # them with its run as `quality-levels`, which the phone page reads. A pull request
  # is compared with the levels its base kept, and fails when one gets worse without
  # a Ratchet-Exception line; its mutation tally is the base's, since the required
  # `mutations` job already demands a full score.
  quality:
    if: github.repository == 'roykollensvendsen/dreame-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --dev
      - name: The base this change lands on
        if: github.event_name == 'pull_request'
        run: echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - name: The levels the base kept
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --commit "$BASE" \
                         --event push --json databaseId -q '.[].databaseId'); do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name quality-levels --dir "$RUNNER_TEMP/base" \
              && break
          done
          ls "$RUNNER_TEMP/base" 2>/dev/null || echo "The base kept no levels; the ratchet will measure it."
      - name: The quality ratchet
        if: github.event_name == 'pull_request'
        env:
          RATCHET_EXCEPTIONS: ${{ github.event.pull_request.body }}
          LEVELS: ${{ runner.temp }}/base/levels.json
        run: uv run python scripts/ratchet.py check --base "$BASE" --levels "$LEVELS" --skip-mutation
      - name: The levels voice reached
        if: github.event_name == 'push'
        run: uv run python scripts/ratchet.py measure --out "$RUNNER_TEMP/levels.json"
      - name: Keep the levels with this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/voice'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-levels
          path: ${{ runner.temp }}/levels.json
          if-no-files-found: error

  commits:
    if: github.repository == 'roykollensvendsen/dreame-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before": check only its last commit.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD^!"
          else
            range="$BASE..$HEAD"
          fi
          pattern='(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          bad=$(git log --no-merges --format='%h %s' "$range" | grep -Ev "^[0-9a-f]+ $pattern" || true)
          if [ -n "$bad" ]; then
            echo "Not conventional commits:"
            echo "$bad"
            exit 1
          fi
          echo "All commit subjects in $range are conventional."
